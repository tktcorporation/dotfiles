name: Validate

on:
  pull_request:

# ワークフロー全体の GITHUB_TOKEN を読み取り専用に絞る。
# 検証しかしないので書き込み権限は不要で、Action やスクリプトが侵害された場合の被害を抑える。
permissions:
  contents: read

jobs:
  brewfile:
    name: Validate Brewfile
    runs-on: macos-latest
    steps:
      # タグは付け替えられるためコミット SHA で固定する (更新は Dependabot)。
      # persist-credentials: false で、後続ステップにトークンを残さない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Homebrew
        # macos-latest ランナーの Homebrew はイメージビルド時点のタップスナップショットを
        # 保持しているため、brew update せずに brew info を呼ぶとイメージ後に追加された
        # formula/cask を「存在しない」と誤判定することがある (例: notion-mail, PR #100)。
        run: brew update

      - name: Check formulae exist
        run: |
          # brew info は稀にネットワーク起因で一時的に失敗することが実際に
          # 観測されている (実在するdirenv/zoxideが1回目はどちらも、2回目は
          # direnvのみ「見つからない」と誤検知され、CIが再現性なく落ちた)。
          # 本当に存在しないformulaと一時的な失敗を区別するため、数回リトライ
          # してから諦める。
          check_exists_with_retry() {
            for _ in 1 2 3; do
              if "$@" &>/dev/null; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          errors=0
          while IFS= read -r formula; do
            if ! check_exists_with_retry brew info "$formula"; then
              echo "::error::Formula not found: $formula"
              errors=$((errors + 1))
            fi
          done < <(grep '^\s*brew "' Brewfile | sed 's/.*brew "\([^"]*\)".*/\1/')

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors formula(e) not found in Homebrew"
            exit 1
          fi
          echo "All formulae validated"

      - name: Check casks exist
        run: |
          # 理由は上の「Check formulae exist」と同じ (brew infoの一時的な失敗対策)。
          check_exists_with_retry() {
            for _ in 1 2 3; do
              if "$@" &>/dev/null; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          errors=0
          while IFS= read -r cask; do
            if ! check_exists_with_retry brew info --cask "$cask"; then
              echo "::error::Cask not found: $cask"
              errors=$((errors + 1))
            fi
          done < <(grep '^\s*cask "' Brewfile | sed 's/.*cask "\([^"]*\)".*/\1/')

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors cask(s) not found in Homebrew"
            exit 1
          fi
          echo "All casks validated"

  chezmoi:
    name: Validate chezmoi templates
    # macOS 向けスクリプトは `{{ if eq .chezmoi.os "darwin" }}` で囲っているため、
    # Linux で展開すると空になり中身が検証されない。実機と同じ macOS で展開・検査する。
    runs-on: macos-latest
    steps:
      # タグは付け替えられるためコミット SHA で固定する (更新は Dependabot)。
      # persist-credentials: false で、後続ステップにトークンを残さない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install chezmoi and shellcheck
        # 以前は get.chezmoi.io のインストーラを curl | sh していたが、setup.sh と同じく Homebrew から入れる。
        run: brew install chezmoi shellcheck

      - name: Render and lint templates
        # 全テンプレートをテスト用データで展開し、展開後のシェルスクリプトに bash -n / shellcheck をかける。
        # ローカルでも同じコマンドで検証できる (scripts/check-templates.sh 冒頭参照)。
        run: bash scripts/check-templates.sh
