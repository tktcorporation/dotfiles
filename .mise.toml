# このリポジトリ自身の開発環境用の設定 (dotfiles リポジトリの開発・CI で使う node/python 等)。
# ユーザー環境へ配布するランタイム設定は dot_config/mise/config.toml
# (chezmoi 経由で ~/.config/mise/config.toml に展開) で別管理している。
# 対象読者・要求バージョン精度が異なる (こちらは幅を持たせた指定) ため意図的に分離しており、統合はしない。
[tools]
node = ["22", "24"]
uv = "latest"
python = "3.14"
pnpm = "10"
jj = "latest"

"npm:@anthropic-ai/claude-code" = "latest"
"npm:@openai/codex" = "latest"
"npm:@google/gemini-cli" = "latest"

"npm:@antfu/ni" = "latest"

# Browser automation
"npm:playwright" = "latest"


[settings]
experimental = true
# .nvmrcファイルを自動的に読み込む設定
legacy_version_file = true
# ディレクトリ移動時に自動的にツールをインストール
auto_install = true

# pipx バックエンドで uvx を使う設定
pipx.uvx = true

[tasks.chromium-path]
run = "ls ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1"
description = "Get Playwright Chromium executable path"

[tasks.ziku]
run = "npx ziku@latest"
description = "Run ziku CLI"
