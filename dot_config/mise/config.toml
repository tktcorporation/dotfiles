# ユーザー環境 (chezmoi apply で ~/.config/mise/config.toml に展開) へ配布するランタイム設定。
# このリポジトリ自身の開発環境用の設定は .mise.toml (リポジトリルート) で別管理している。
# 対象読者・用途が異なるため意図的に分離しており統合しない。
#
# バージョンは厳密ピンせず、メジャー (またはマイナー) の範囲だけを指定する。
# 過去に固定したまま忘れてセキュリティ修正を取りこぼすのを防ぐため。
# 範囲内の最新パッチへの追従は run_after_upgrade-tools.sh.tmpl が apply のたびに行う。
[tools]
# 最新の LTS に自動追従する (現在は 24。26 が LTS 入りすると apply 時に 26 へ上がる)。
node = "lts"
# Claude Code は npm 版ではなく公式ネイティブバイナリを使う (mise registry の claude =
# aqua:anthropics/claude-code で GitHub Releases の単体バイナリを取得)。
# Anthropic が npm 配布より native install を推奨しており、Node のバージョンにも依存しないため。
claude = "latest"
"npm:@openai/codex" = "latest"
"npm:@devcontainers/cli" = "latest"
"npm:@antfu/ni" = "latest"
bun = "1"
pnpm = "12"
python = "3.15"
uv = "latest"

[settings]
# サプライチェーン攻撃対策のクールダウン: 公開から 12 時間未満のバージョンは install/upgrade しない。
# 方針と例外手順は README の「サプライチェーン対策」を参照。
minimum_release_age = "12h"

[env]
# パッケージマネージャ側のクールダウン (公開から 12 時間未満のバージョンは解決しない)。
# ~/.npmrc や ~/Library/Preferences/pnpm/config.yaml 等のグローバル設定ファイルを
# 増やさず、mise の中に閉じて一元管理するため環境変数で渡す
# (mise activate / shim / mise exec のいずれの経路でも渡ることを確認済み)。
# bun だけは環境変数で設定できないため ~/.bunfig.toml (dot_bunfig.toml) で設定している。
# 方針と例外手順は README の「サプライチェーン対策」を参照。
npm_config_min_release_age = "0.5"          # npm: 単位は日
pnpm_config_minimum_release_age = "720"     # pnpm: 単位は分
UV_EXCLUDE_NEWER = "12 hours"               # uv
