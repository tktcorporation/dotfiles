# ユーザー環境 (chezmoi apply で ~/.config/mise/config.toml に展開) へ配布するランタイム設定。
# このリポジトリ自身の開発環境用の設定は .mise.toml (リポジトリルート) で別管理している。
# 配布先はバージョンを厳密ピンする一方、リポジトリ開発用は幅を持たせている。意図的な分離であり統合しない。
[tools]
node = "22"
# Claude Code は npm 版ではなく公式ネイティブバイナリを使う (mise registry の claude =
# aqua:anthropics/claude-code で GitHub Releases の単体バイナリを取得)。
# Anthropic が npm 配布より native install を推奨しており、Node のバージョンにも依存しないため。
claude = "latest"
"npm:@devcontainers/cli" = "0.81.1"
"npm:@antfu/ni" = "27.0.1"
bun = "1.3.5"
pnpm = "10.25.0"
python = "3.14.2"
uv = "0.9.6"
